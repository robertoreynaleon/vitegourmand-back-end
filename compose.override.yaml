
services:
  backend:
    volumes:
      # Le code reste éditable depuis WSL pendant le développement.
      - .:/var/www/html
      # Les fichiers générés par Linux restent isolés dans Docker.
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
      - backend_jwt:/var/www/html/config/jwt
